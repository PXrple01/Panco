[workspace]
resolver = "2"
members = ["core", "voice", "src-tauri", "waechter"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

# Kleine Binärdatei, wenig RAM: Größe optimieren, LTO, keine Panics-Unwinds.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
