[package]
name = "panco"
description = "Panco – sprachgesteuerter Gaming-Companion (Windows)"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
panco-core = { path = "../core" }
panco-voice = { path = "../voice" }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-dialog = "2.8.3"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = ["Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Registry"]
